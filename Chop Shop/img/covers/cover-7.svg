<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background: flat near-black -->
  <rect width="512" height="512" fill="#1d0f0a" />

  <!-- Calm, uncluttered center kept empty for app initials overlay -->

  <!-- A wide low accent semicircle beneath the first upright bar -->
  <path d="M 120,380 A 70,35 0 0,0 260,380 Z" fill="#f2b8a2" />

  <!-- Thin second-colour guide lines -->
  <g stroke="#8fa2ff" stroke-width="2" fill="none" stroke-linecap="square">
    <line x1="160" y1="180" x2="160" y2="340" />
    <line x1="220" y1="180" x2="220" y2="340" />
    <line x1="280" y1="180" x2="280" y2="340" />
    <line x1="340" y1="180" x2="340" y2="340" />
  </g>

  <!-- Row of off-white bars: first stands upright exactly on its line, the rest lean back (slouch) behind their guide lines -->
  <g fill="#f8f5ee">
    <!-- 1st bar: upright -->
    <rect x="152" y="180" width="16" height="160" />
    
    <!-- 2nd bar: leaning back -->
    <rect x="212" y="180" width="16" height="160" transform="rotate(-12 220 340)" />
    
    <!-- 3rd bar: leaning back further -->
    <rect x="272" y="180" width="16" height="160" transform="rotate(-20 280 340)" />
    
    <!-- 4th bar: leaning back most -->
    <rect x="332" y="180" width="16" height="160" transform="rotate(-28 340 340)" />
  </g>
</svg>